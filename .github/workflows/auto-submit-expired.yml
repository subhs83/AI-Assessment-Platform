
name: Auto Submit Expired Quizzes

on:
  workflow_dispatch:

concurrency:
  group: indiaeducore-expired-quiz-submission
  cancel-in-progress: false

jobs:
  auto-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Submit expired quizzes
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          FLASK_ENV: production
        run: python process_expired_attempts.py --batch-submit

      - name: Sync cron-job.org status
        if: always()
        env:
          CRONJOB_SYNC_TOKEN: ${{ secrets.CRONJOB_SYNC_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --url https://indiaeducore.com/api/internal/sync-cron-job \
            --header "Authorization: Bearer ${CRONJOB_SYNC_TOKEN}"
